/*
 * alice-agent-command: 抽象指令层
 *
 * 定义 AgentCommand 密封接口体系，供 facade-cmd 与 facade-tui 共同依赖。
 * 对应 docs/app/AgentCommand.md 中的类图。
 */

plugins {
    id 'groovy'
    id 'java-library'
}

group = "org.cland.alice"
version = "0.1.0"

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.16'

    // Groovy / Spock for testing
    testImplementation 'org.apache.groovy:groovy:4.0.30'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ── Hole test source set (dedicated module boundary probes) ──
sourceSets {
    hole {
        java {
            srcDirs = ['src/hole/java']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    holeImplementation.extendsFrom implementation
    holeRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('runHoleTest', JavaExec) {
    description = 'Run a hole test probe against the command module boundary'
    group = 'verification'
    classpath = files(
        sourceSets.hole.output,
        sourceSets.main.output
    ) + configurations.holeRuntimeClasspath
    mainClass = 'org.cland.alice.agent.command.CommandHoleTest'
    modularity.inferModulePath = false
}
