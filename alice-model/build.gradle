/*
 * This source file was generated by the Skeletal project creation tool.
 * https://github.com/cbmarcum/skeletal
 */

plugins {
    // Apply the groovy plugin to also add support for Groovy (needed for Spock)
    id 'groovy'
}

// group and version used for application 
group = "org.cland.alice"
version = "0.1.0"


repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // === SLF4J + Logback (replaces System.getLogger) ===
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'ch.qos.logback:logback-core:1.5.16'

    // Guava：升级到兼容 Java 21+ 的最新稳定版（33.6.0-jre 适配高版本 Java）
    implementation 'com.google.guava:guava:33.6.0-jre'

    // Jackson（用于 JSON 序列化 tools schema 中的 JsonNode）
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'

    // Groovy：升级到适配 Java 25 的最新稳定版（4.0.30 修复高版本 Java 兼容问题）
    testImplementation 'org.apache.groovy:groovy:4.0.30'

    // Spock：替换非稳定版为最新稳定版（2.4 正式版，适配 Groovy 4.0 + Java 21+）
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'

    // JUnit Platform Launcher（Spock 需要）
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Logback：升级到最新稳定版，适配 Java 25
    testImplementation 'ch.qos.logback:logback-classic:1.5.22'

    // Spock 报告：使用适配 Groovy 4.0 的稳定版
    testImplementation("com.athaydes:spock-reports:2.5.1-groovy-4.0") {
        transitive = false // 避免覆盖 Groovy/Spock 版本
    }

    // Groovy 扩展库：与 Groovy 主版本保持一致，适配 Java 25
    testImplementation "org.apache.groovy:groovy-xml:4.0.30"
    testImplementation "org.apache.groovy:groovy-json:4.0.30"
    testImplementation "org.apache.groovy:groovy-templates:4.0.30"

    // 可选：若遇到 Java 模块系统兼容问题，添加 SLF4J 桥接（Java 25 强化了模块检查）
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
}

// ========== Hole test source set ==========
sourceSets {
    hole {
        java {
            srcDirs = ['src/hole/java']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    holeImplementation.extendsFrom implementation
    holeRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // Hole test source set depends on main module output
    holeImplementation sourceSets.main.output
}

// ========== runHoleTest task ==========
/**
 * Run a real module-boundary hole test.
 *
 * Usage:
 *   ./gradlew :alice-model:runHoleTest --args="dispatch"
 *   ./gradlew :alice-model:runHoleTest --args="call"
 *   ./gradlew :alice-model:runHoleTest --args="supplier"
 *   ./gradlew :alice-model:runHoleTest --args="config"
 *   ./gradlew :alice-model:runHoleTest --args="multi"
 *   ./gradlew :alice-model:runHoleTest --args="all"
 */
tasks.register('runHoleTest', JavaExec) {
    group = 'verification'
    description = 'Run ModelHoleTest (real module boundary probe)'

    classpath = sourceSets.hole.runtimeClasspath
    mainClass = 'org.cland.alice.model.ModelHoleTest'

    modularity.inferModulePath = true
    // Parse args from --args or default to "all"
    args = project.hasProperty('holeArgs') ? holeArgs.tokenize() : (project.findProperty('args') ?: 'all').toString().tokenize()
}

tasks.named('runHoleTest') {
    dependsOn 'classes', 'holeClasses'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.encoding = 'UTF-8'
}

jar {
    // archive name before version
    archiveBaseName = 'alice-model'
}


tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()

    // spock reports
    systemProperty 'com.athaydes.spockframework.report.showCodeBlocks', true
}
