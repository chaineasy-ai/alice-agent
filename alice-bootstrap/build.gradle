 */

plugins {
    id 'groovy'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.11.5'
}

group = "org.cland.alice"
version = "0.1.0"

repositories {
    mavenCentral()
}

dependencies {
    // === SLF4J + Logback (replaces System.getLogger) ===
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'ch.qos.logback:logback-core:1.5.16'

    // Local submodule dependencies — only facade modules
    // Bootstrap is a Pure Bootstrapper: no Agent/Model/Config awareness.
    implementation project(':alice-facade-cmd')
    implementation project(':alice-facade-tui')

    // Test-only: alice-agent-command types used in dispatch integration tests
    testImplementation project(':alice-agent-command')

    testImplementation 'org.apache.groovy:groovy:4.0.30'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'ch.qos.logback:logback-classic:1.5.22'
    testImplementation("com.athaydes:spock-reports:2.5.1-groovy-4.0") {
        transitive = false
    }
    testImplementation "org.apache.groovy:groovy-xml:4.0.30"
    testImplementation "org.apache.groovy:groovy-json:4.0.30"
    testImplementation "org.apache.groovy:groovy-templates:4.0.30"
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

// ── JVM 运行编码 ──────────────────────────────────────────────────────────
// 确保 `./gradlew run` 和分发脚本生成的启动器都带上 UTF-8 编码参数
tasks.withType(JavaExec).configureEach {
    jvmArgs("-Dfile.encoding=UTF-8")
}

application {
    mainClass = 'org.cland.alice.agent.AliceApp'
    applicationName = 'alice-agent'
    applicationDefaultJvmArgs = ["-Dfile.encoding=UTF-8"]
}

graalvmNative {
    binaries {
        main {
            imageName = 'alice-agent'

            // 1. 【核心修复】解锁实验性参数（必须放在最前面，压制 json-schema-validator 的警告）
            buildArgs.add('-H:+UnlockExperimentalVMOptions')

            // 2. 【核心修复】用最高兼容性的 -D 语法锁死编译期和运行期编码
            // GraalVM 会在 AOT 阶段捕获这个系统变量并固化进原生快照的 System.getProperties() 中
            buildArgs.add('-Dfile.encoding=UTF-8')
            buildArgs.add('-Dsun.stdout.encoding=UTF-8')
            buildArgs.add('-Dsun.stderr.encoding=UTF-8')
            buildArgs.add('-H:+AddAllCharsets')

            // 3. Vert.x / Netty / JNA: 运行时初始化配置
            buildArgs.add('--initialize-at-run-time=io.netty.util.internal.logging')
            buildArgs.add('--initialize-at-run-time=io.netty.util.internal.PlatformDependent')
            buildArgs.add('--initialize-at-run-time=io.vertx')
            buildArgs.add('--initialize-at-run-time=com.sun.jna')
            buildArgs.add('--initialize-at-run-time=org.jline')

            // JANSI: 必须在运行时初始化，防止 AOT 阶段加载 Windows DLL 失败
            buildArgs.add('--initialize-at-run-time=org.fusesource.jansi')
            buildArgs.add('--initialize-at-run-time=org.fusesource.hawtjni')
            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl.jansi')

            // 4. Java 25 模块化加固与 JLine 管道反射开放
            buildArgs.add('--enable-native-access=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.lang=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/io=ALL-UNNAMED')

            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl.jna.win.JnaWinSysTerminal')
            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl.jna.linux.LinuxNativeTerminal')
            // 确保引入了 JLine 的 JNA 适配包，这是脱离 JVM 后原生程序能抓到系统控制台句柄的底座
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.encoding = 'UTF-8'
}

// 针对 application 插件自动生成的分发任务
distributions {
    main {
        contents {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

jar {
    archiveBaseName = 'alice-agent'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'com.athaydes.spockframework.report.showCodeBlocks', true
}
