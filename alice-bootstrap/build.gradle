/*
 * This source file was generated by the Skeletal project creation tool.
 * https://github.com/cbmarcum/skeletal
 */

plugins {
    id 'groovy'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.11.5'
}

group = "org.cland.alice"
version = "0.1.0"

repositories {
    mavenCentral()
}

dependencies {
    // === SLF4J + Logback ===
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'ch.qos.logback:logback-core:1.5.16'

    // Facade modules are discovered at runtime via SPI (ServiceLoader).
    // Compile-time dependency is only on the SPI interface in this module.
    // runtimeOnly keeps facade JARs on the module path so ServiceLoader finds them.
    runtimeOnly project(':alice-facade-cmd')
    runtimeOnly project(':alice-facade-tui')

    // Test-only dependencies
    testImplementation project(':alice-agent-command')
    testImplementation project(':alice-facade-cmd')
    testImplementation 'org.apache.groovy:groovy:4.0.30'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'ch.qos.logback:logback-classic:1.5.22'
    testImplementation("com.athaydes:spock-reports:2.5.1-groovy-4.0") {
        transitive = false
    }
    testImplementation "org.apache.groovy:groovy-xml:4.0.30"
    testImplementation "org.apache.groovy:groovy-json:4.0.30"
    testImplementation "org.apache.groovy:groovy-templates:4.0.30"
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
}

// ========== Hole test source set ==========
sourceSets {
    hole {
        java {
            srcDirs = ['src/hole/java']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

configurations {
    holeImplementation.extendsFrom implementation
    holeRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    holeImplementation sourceSets.main.output
}

// ========== runHoleTest task ==========
tasks.register('runHoleTest', JavaExec) {
    group = 'verification'
    description = 'Run BootstrapHoleTest (real module boundary probe)'

    classpath = sourceSets.hole.runtimeClasspath
    mainClass = 'org.cland.alice.agent.BootstrapHoleTest'

    modularity.inferModulePath = true
    args = (project.findProperty('args') ?: 'all').toString().tokenize()
}

tasks.named('runHoleTest') {
    dependsOn 'classes', 'holeClasses'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

// ── JVM 运行编码 ──
tasks.withType(JavaExec).configureEach {
    jvmArgs("-Dfile.encoding=UTF-8")
    standardInput = System.in
}

application {
    mainClass = 'org.cland.alice.agent.AliceApp'
    applicationName = 'alice'
    applicationDefaultJvmArgs = [
        "-Dfile.encoding=UTF-8",
        // JDK 25+: required by jansi/jna for native access via System::load
        "--enable-native-access=ALL-UNNAMED"
    ]
}

graalvmNative {
    binaries {
        main {
            imageName = 'alice'

            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            buildArgs.add('-Dfile.encoding=UTF-8')
            buildArgs.add('-Dsun.stdout.encoding=UTF-8')
            buildArgs.add('-Dsun.stderr.encoding=UTF-8')
            buildArgs.add('-H:+AddAllCharsets')

            buildArgs.add('--initialize-at-run-time=io.netty.util.internal.logging')
            buildArgs.add('--initialize-at-run-time=io.netty.util.internal.PlatformDependent')
            buildArgs.add('--initialize-at-run-time=io.vertx')
            buildArgs.add('--initialize-at-run-time=com.sun.jna')
            buildArgs.add('--initialize-at-run-time=org.jline')

            buildArgs.add('--initialize-at-run-time=org.fusesource.jansi')
            buildArgs.add('--initialize-at-run-time=org.fusesource.hawtjni')
            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl.jansi')

            buildArgs.add('--enable-native-access=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/java.lang=ALL-UNNAMED')
            buildArgs.add('--add-opens=java.base/io=ALL-UNNAMED')

            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl.jna.win.JnaWinSysTerminal')
            buildArgs.add('--initialize-at-run-time=org.jline.terminal.impl.jna.linux.LinuxNativeTerminal')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.encoding = 'UTF-8'
}

distributions {
    main {
        contents {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

jar {
    archiveBaseName = 'alice'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'com.athaydes.spockframework.report.showCodeBlocks', true
}
