 * https://github.com/cbmarcum/skeletal
 */

plugins {
    // Apply the groovy plugin to also add support for Groovy (needed for Spock)
    id 'groovy'
    id 'application'
}

// group and version used for application 
group = "org.cland.alice"
version = "0.1.0"


repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // === SLF4J + Logback (replaces System.getLogger) ===
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'ch.qos.logback:logback-core:1.5.16'

    // 本地子模块依赖
    implementation project(':alice-core-agent')
    implementation project(':alice-model')

    // vert.x（AgentCore 依赖）
    implementation 'io.vertx:vertx-core:5.0.8'

    // picocli — 命令行参数解析
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // Jackson 用于 JSON 序列化
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'

    // Guava
    implementation 'com.google.guava:guava:33.6.0-jre'

    // Groovy / Spock for testing
    testImplementation 'org.apache.groovy:groovy:4.0.30'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'ch.qos.logback:logback-classic:1.5.22'
    testImplementation("com.athaydes:spock-reports:2.5.1-groovy-4.0") {
        transitive = false
    }
    testImplementation "org.apache.groovy:groovy-xml:4.0.30"
    testImplementation "org.apache.groovy:groovy-json:4.0.30"
    testImplementation "org.apache.groovy:groovy-templates:4.0.30"
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    modularity.inferModulePath = true
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'alice-facade-cmd'
}

application {
    mainClass = 'org.cland.alice.facade.cmd.AliceCliLauncher'
    applicationName = 'alice'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'com.athaydes.spockframework.report.showCodeBlocks', true
}
