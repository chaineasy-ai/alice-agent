# Alice Agent CI — Build, Test, JVM Distribution & Native Image (Linux · macOS · Windows)
#
# 全模块构建 + 测试 + 三平台 GraalVM Native Image 可执行文件。
#
# Native Image 产物：
#   Linux:   alice-bootstrap/build/native/nativeCompile/alice           (ELF)
#   macOS:   alice-bootstrap/build/native/nativeCompile/alice           (Mach-O)
#   Windows: alice-bootstrap/build/native/nativeCompile/alice.exe       (PE)
#
# JVM 分发包：
#   alice-bootstrap/build/install/alice/   (启动脚本 + 所有模块 JAR)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ────────────────────────────────────────────────────────────────────────────
# 共享环境变量
# ────────────────────────────────────────────────────────────────────────────
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

# ────────────────────────────────────────────────────────────────────────────
# Build & Test (JVM) — 三平台验证
# ────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      # 任一平台失败不影响其他平台
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build all modules
        run: ./gradlew assemble --no-daemon

      - name: Run all tests
        run: ./gradlew test --no-daemon

      - name: Build JVM distribution
        run: ./gradlew :alice-bootstrap:installDist --no-daemon

      - name: Upload JVM distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: alice-jvm-dist-${{ matrix.os }}
          path: alice-bootstrap/build/install/alice/
          retention-days: 7

      - name: Verify JVM launcher (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== Build Artifacts ==="
          ls -la alice-bootstrap/build/install/alice/bin/
          echo ""
          echo "=== Module JARs ==="
          ls -la alice-bootstrap/build/install/alice/lib/*.jar | wc -l
          echo "JARs total"
          echo ""
          echo "=== Launcher check ==="
          if [ -f alice-bootstrap/build/install/alice/bin/alice ]; then
            echo "✅ JVM distribution ready: alice/bin/alice"
          else
            echo "❌ JVM distribution not found"
            exit 1
          fi

      - name: Verify JVM launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Build Artifacts ==="
          Get-ChildItem -Path alice-bootstrap/build/install/alice/bin/ -Name
          Write-Host ""
          Write-Host "=== Module JARs ==="
          $count = (Get-ChildItem -Path alice-bootstrap/build/install/alice/lib/*.jar).Count
          Write-Host "$count JARs total"
          Write-Host ""
          if (Test-Path "alice-bootstrap/build/install/alice/bin/alice.bat") {
            Write-Host "✅ JVM distribution ready: alice/bin/alice.bat"
          } else {
            Write-Host "❌ JVM distribution not found"
            exit 1
          }

  # ────────────────────────────────────────────────────────────────────────────
  # GraalVM Native Image — 三平台并行构建
  # ────────────────────────────────────────────────────────────────────────────
  native-image:
    needs: [build]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: graalvm
          cache: gradle

      - name: Make gradlew executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Install native-image tool
        shell: bash
        run: |
          gu install native-image || echo "native-image already installed"

      - name: Build Native Image
        run: ./gradlew :alice-bootstrap:nativeCompile --no-daemon

      - name: Verify native binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== Native Image Binary ==="
          ls -lh alice-bootstrap/build/native/nativeCompile/
          echo ""
          if [ -f alice-bootstrap/build/native/nativeCompile/alice ]; then
            file alice-bootstrap/build/native/nativeCompile/alice
            echo ""
            echo "✅ GraalVM Native Image (${{ matrix.os }}) built successfully"
          else
            echo "❌ Native image binary not found"
            exit 1
          fi

      - name: Verify native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Native Image Binary ==="
          Get-ChildItem -Path alice-bootstrap/build/native/nativeCompile/ -Name
          if (Test-Path "alice-bootstrap/build/native/nativeCompile/alice.exe") {
            Write-Host "✅ GraalVM Native Image (Windows) built successfully"
          } else {
            Write-Host "❌ Native image binary not found"
            exit 1
          }

      - name: Upload Native Image artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v4
        with:
          name: alice-native-${{ matrix.os }}
          # 排除 .build_artifacts.txt 等元数据文件
          path: |
            alice-bootstrap/build/native/nativeCompile/alice*
            !alice-bootstrap/build/native/nativeCompile/*.build*
            !alice-bootstrap/build/native/nativeCompile/*.txt
          retention-days: 7


